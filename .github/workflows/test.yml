name: UNLOS checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check server.js
      - run: node --check public/app.js
      - run: npm test
      - name: Build and exercise Docker image
        if: matrix.node == '24'
        run: |
          docker build -t unlos-ci .
          docker run -d --name unlos-ci -p 127.0.0.1:3101:3000 unlos-ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3101/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3101/
          docker logs unlos-ci
          docker stop unlos-ci
          docker rm unlos-ci
